version: "3.8"

# WordPress + WooCommerce pour le projet P059 — à lancer sur la VM du bac à sable.
# WooCommerce lui-même s'installe ensuite en 2 clics dans l'admin WordPress
# (pas de plugin Docker officiel pour WooCommerce, mais l'installation web
# prend moins de 2 minutes une fois WordPress up).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_pw_change_me
      MYSQL_ROOT_PASSWORD: root_pw_change_me
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_pw_change_me
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
